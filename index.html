<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ridgeline</title>
<meta name="description" content="Strength and trail-running training for mountain athletes">
<meta name="theme-color" content="#111718">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ridgeline">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="assets/ridgeline-favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  /* Ridgeline visual identity v1.2 · Inter is bundled (fonts/Inter-OFL.txt); system fonts are the fallback. */
  @font-face { font-family:Inter; src:url("fonts/Inter-Variable.ttf") format("truetype"); font-weight:100 900; font-style:normal; font-display:swap; }
  html, body { margin:0; padding:0; height:100%; background:#111718; overscroll-behavior:none;
    -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent; color:#1C2628;
    font-family:Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size:16px; line-height:24px; font-synthesis:none; -webkit-font-smoothing:antialiased; }
  :root { --gutter:20px; }
  @media (max-width: 360px) { :root { --gutter:16px; } }
  #root { height:100%; }
  button, input, select, summary { font-family:inherit; touch-action:manipulation; }
  /* Phone first: fill the screen; keep content clear of the notch and home bar. */
  .rl-shell  { position:relative; height:100%; box-sizing:border-box; padding-top:env(safe-area-inset-top); background:#111718; }
  .rl-scroll { height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; background:#F7F5F0; scroll-padding-top:72px;
               padding-bottom:env(safe-area-inset-bottom); box-sizing:border-box; }
  /* Larger screens gain margin, never longer lines (reading column max 720px). */
  @media (min-width: 760px) {
    body { background:#EFEBE4; }
    #root { padding:24px 0; box-sizing:border-box; }
    .rl-shell { max-width:720px; margin:0 auto; border-radius:16px; overflow:hidden; padding-top:0;
                box-shadow:0 1px 2px rgba(28,38,40,.06), 0 12px 32px rgba(28,38,40,.10); }
  }
  /* One visible focus treatment everywhere: 3px ring, 3px gap. */
  :focus-visible { outline:3px solid #35636B; outline-offset:3px; box-shadow:0 0 0 3px #F7F5F0; }
  .on-dark :focus-visible { outline-color:#A2CDD3; box-shadow:0 0 0 3px #111718; }
  .rl-btn { transition:background 120ms cubic-bezier(.2,0,0,1); cursor:pointer; }
  .rl-btn:not(.rl-primary):hover { background:#EFEBE4 !important; }
  .rl-primary:hover  { background:#F65B2E !important; }
  .rl-primary:active { background:#FF7047 !important; }
  button:disabled { cursor:not-allowed; }
  input::placeholder { color:#5E696B; opacity:1; }
  /* Disclosures: a real <details> with a plain +/− marker. */
  summary { list-style:none; }
  summary::-webkit-details-marker { display:none; }
  summary::before { content:"+"; font-weight:400; font-size:20px; margin-right:8px; }
  details[open] > summary::before { content:"−"; }
  @keyframes rlRise { from { opacity:0; transform:translateY(4px) } to { opacity:1; transform:none } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; scroll-behavior:auto !important; }
  }
  noscript div { color:#fff; padding:40px 20px; text-align:center; }
</style>
</head>
<body>
<div id="root"></div>
<noscript><div>Ridgeline needs JavaScript turned on.</div></noscript>
<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
</script>
</body>
</html>
