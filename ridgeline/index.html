<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ridgeline</title>
<meta name="description" content="Mountain athlete training program">
<meta name="theme-color" content="#1B2426">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ridgeline">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  html, body { margin:0; padding:0; height:100%; background:#1B2426; overscroll-behavior:none;
    -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing:antialiased; }
  #root { height:100%; }
  /* Phone first: fill the screen; keep content clear of the notch and home bar. */
  .rl-shell  { position:relative; height:100%; box-sizing:border-box;
               padding-top:env(safe-area-inset-top); background:#1B2426; }
  .rl-scroll { height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; background:#FAF8F4;
               padding-bottom:env(safe-area-inset-bottom); box-sizing:border-box; }
  /* Larger screens gain margin, never longer lines. */
  @media (min-width: 620px) {
    body { background:#F2EFE8; }
    #root { padding:22px 0; box-sizing:border-box; }
    .rl-shell { max-width:560px; margin:0 auto; border-radius:16px; overflow:hidden; padding-top:0;
                box-shadow:0 1px 2px rgba(27,36,38,.06), 0 12px 32px rgba(27,36,38,.10); }
  }
  input::placeholder { color:#8A918F; font-weight:500; }
  @keyframes rlFade { from { opacity:0 } to { opacity:1 } }
  @keyframes rlRise { from { opacity:0; transform:translateY(4px) } to { opacity:1; transform:none } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
  noscript div { color:#fff; padding:40px 20px; text-align:center; }
</style>
</head>
<body>
<div id="root"></div>
<noscript><div>Ridgeline needs JavaScript turned on.</div></noscript>
<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
</script>
</body>
</html>
